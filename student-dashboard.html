<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Student Dashboard - ZP High School, Chavitipalem"
    >

    <title>Student Dashboard | ZP High School</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =========================================
           STUDENT DASHBOARD
        ========================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f9fd;
            color: #183b56;
        }

        button,
        input {
            font-family: inherit;
        }

        /* =========================================
           HEADER
        ========================================= */

        .dashboard-header {
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #e3edf5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .dashboard-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 43px;
            height: 43px;
            border-radius: 12px;
            background: #eaf5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 17px;
            color: #163c5b;
        }

        .brand-text p {
            margin: 3px 0 0;
            font-size: 11px;
            color: #7890a3;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .notification-button {
            width: 40px;
            height: 40px;
            border: 1px solid #e3edf5;
            border-radius: 12px;
            background: #ffffff;
            cursor: pointer;
            font-size: 18px;
            position: relative;
        }

        .notification-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #2878bd;
            position: absolute;
            top: 8px;
            right: 8px;
        }

        .student-mini-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .student-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #dceeff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
        }

        .student-mini-name {
            font-size: 13px;
            font-weight: 700;
            color: #254c68;
        }

        .student-mini-class {
            margin-top: 3px;
            font-size: 11px;
            color: #8397a8;
        }

        /* =========================================
           LAYOUT
        ========================================= */

        .dashboard-layout {
            display: flex;
            min-height: calc(100vh - 72px);
        }

        /* =========================================
           SIDEBAR
        ========================================= */

        .dashboard-sidebar {
            width: 235px;
            background: #ffffff;
            border-right: 1px solid #e3edf5;
            padding: 25px 15px;
            flex-shrink: 0;
        }

        .sidebar-title {
            padding: 0 12px;
            margin: 0 0 12px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9aabba;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .sidebar-link {
            width: 100%;
            border: none;
            background: transparent;
            color: #61788b;
            padding: 12px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            gap: 11px;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .sidebar-link:hover {
            background: #f1f7fc;
            color: #2878bd;
        }

        .sidebar-link.active {
            background: #eaf5ff;
            color: #1769aa;
            font-weight: 700;
        }

        .sidebar-icon {
            width: 25px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-bottom {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid #edf2f6;
        }

        .logout-button {
            color: #c15a5a;
        }

        .logout-button:hover {
            background: #fff4f4;
            color: #b63d3d;
        }

        /* =========================================
           MAIN
        ========================================= */

        .dashboard-main {
            flex: 1;
            padding: 35px 5%;
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
        }

        .dashboard-section {
            display: none;
        }

        .dashboard-section.active {
            display: block;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =========================================
           PAGE TITLE
        ========================================= */

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-heading h2 {
            margin: 0;
            font-size: 28px;
            color: #163c5b;
        }

        .page-heading p {
            margin: 7px 0 0;
            color: #788d9e;
            font-size: 13px;
        }

        .date-badge {
            background: #ffffff;
            border: 1px solid #e2ecf4;
            border-radius: 12px;
            padding: 10px 14px;
            color: #60798e;
            font-size: 12px;
        }

        /* =========================================
           WELCOME CARD
        ========================================= */

        .welcome-card {
            background:
                linear-gradient(
                    135deg,
                    #e7f4ff,
                    #f5fbff
                );
            border: 1px solid #dcecf8;
            border-radius: 20px;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .welcome-card h3 {
            margin: 0 0 7px;
            font-size: 21px;
            color: #174365;
        }

        .welcome-card p {
            margin: 0;
            font-size: 13px;
            color: #688198;
        }

        .welcome-emoji {
            font-size: 65px;
            opacity: 0.8;
        }

        /* =========================================
           STAT CARDS
        ========================================= */

        .stats-grid {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #ffffff;
            border: 1px solid #e5edf4;
            border-radius: 17px;
            padding: 20px;
        }

        .stat-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: #eef7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .stat-label {
            margin-top: 15px;
            color: #7b90a1;
            font-size: 12px;
        }

        .stat-value {
            margin-top: 5px;
            color: #173e5b;
            font-size: 24px;
            font-weight: 700;
        }

        .stat-small {
            margin-top: 5px;
            color: #7c91a1;
            font-size: 11px;
        }

        /* =========================================
           TWO COLUMN
        ========================================= */

        .dashboard-grid {
            display: grid;
            grid-template-columns:
                minmax(0, 1.35fr)
                minmax(300px, 0.65fr);
            gap: 20px;
        }

        .dashboard-card {
            background: #ffffff;
            border: 1px solid #e4edf4;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .card-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .card-heading h3 {
            margin: 0;
            font-size: 16px;
            color: #234c68;
        }

        .view-all {
            border: none;
            background: transparent;
            color: #2878bd;
            cursor: pointer;
            font-size: 12px;
        }

        /* =========================================
           NOTICES
        ========================================= */

        .notice-item {
            display: flex;
            gap: 13px;
            padding: 13px 0;
            border-bottom: 1px solid #edf2f6;
        }

        .notice-item:last-child {
            border-bottom: none;
        }

        .notice-date {
            width: 43px;
            height: 43px;
            border-radius: 11px;
            background: #eef7ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .notice-date strong {
            font-size: 15px;
            color: #2878bd;
        }

        .notice-date span {
            font-size: 8px;
            text-transform: uppercase;
            color: #7590a4;
        }

        .notice-content h4 {
            margin: 2px 0 5px;
            font-size: 13px;
            color: #31546d;
        }

        .notice-content p {
            margin: 0;
            color: #8294a2;
            font-size: 11px;
            line-height: 1.5;
        }

        /* =========================================
           ATTENDANCE
        ========================================= */

        .attendance-box {
            text-align: center;
        }

        .attendance-circle {
            width: 145px;
            height: 145px;
            border-radius: 50%;
            margin: 10px auto 18px;
            background:
                conic-gradient(
                    #4d96ca 0deg 316deg,
                    #e8f0f5 316deg 360deg
                );
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .attendance-inner {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .attendance-inner strong {
            font-size: 27px;
            color: #245676;
        }

        .attendance-inner span {
            font-size: 10px;
            color: #8195a5;
            margin-top: 3px;
        }

        .attendance-info {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #edf2f6;
            padding-top: 15px;
        }

        .attendance-info strong {
            display: block;
            font-size: 15px;
            color: #315772;
        }

        .attendance-info span {
            display: block;
            margin-top: 4px;
            font-size: 10px;
            color: #8295a5;
        }

        /* =========================================
           RESULTS
        ========================================= */

        .result-table-wrapper {
            overflow-x: auto;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 550px;
        }

        .result-table th {
            text-align: left;
            padding: 12px;
            background: #f5f9fc;
            color: #698195;
            font-size: 11px;
            font-weight: 700;
        }

        .result-table td {
            padding: 13px 12px;
            border-bottom: 1px solid #edf2f6;
            color: #45657b;
            font-size: 12px;
        }

        .result-status {
            padding: 5px 9px;
            border-radius: 20px;
            background: #edf9f1;
            color: #348054;
            font-size: 10px;
            font-weight: 700;
        }

        /* =========================================
           PROFILE
        ========================================= */

        .profile-card {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 30px;
            align-items: start;
        }

        .large-avatar {
            width: 140px;
            height: 140px;
            border-radius: 24px;
            background: #eaf5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        .profile-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .profile-field {
            background: #f7fafc;
            border-radius: 12px;
            padding: 14px;
        }

        .profile-field span {
            display: block;
            color: #8a9baa;
            font-size: 10px;
            margin-bottom: 5px;
        }

        .profile-field strong {
            color: #365872;
            font-size: 13px;
        }

        /* =========================================
           ACHIEVEMENTS
        ========================================= */

        .achievement-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .achievement-card {
            padding: 22px;
            border: 1px solid #e4edf4;
            border-radius: 16px;
            background: #ffffff;
        }

        .achievement-icon {
            width: 45px;
            height: 45px;
            border-radius: 13px;
            background: #fff8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            margin-bottom: 15px;
        }

        .achievement-card h4 {
            margin: 0 0 6px;
            font-size: 14px;
            color: #36566c;
        }

        .achievement-card p {
            margin: 0;
            color: #8597a6;
            font-size: 11px;
            line-height: 1.5;
        }

        /* =========================================
           EVENTS
        ========================================= */

        .event-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid #edf2f6;
        }

        .event-item:last-child {
            border-bottom: none;
        }

        .event-date {
            width: 50px;
            height: 50px;
            border-radius: 13px;
            background: #eef7ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .event-date strong {
            color: #2878bd;
            font-size: 17px;
        }

        .event-date span {
            color: #7890a1;
            font-size: 8px;
            text-transform: uppercase;
        }

        .event-item h4 {
            margin: 0 0 5px;
            color: #365870;
            font-size: 13px;
        }

        .event-item p {
            margin: 0;
            color: #8899a7;
            font-size: 11px;
        }

        /* =========================================
           PASSWORD
        ========================================= */

        .password-form {
            max-width: 520px;
        }

        .password-group {
            margin-bottom: 17px;
        }

        .password-group label {
            display: block;
            margin-bottom: 7px;
            color: #49677d;
            font-size: 12px;
            font-weight: 700;
        }

        .password-group input {
            width: 100%;
            height: 47px;
            border: 1px solid #dce7ef;
            border-radius: 11px;
            padding: 0 13px;
            outline: none;
            background: #fbfdff;
        }

        .password-group input:focus {
            border-color: #6da8d2;
            box-shadow: 0 0 0 3px rgba(55, 135, 193, 0.08);
        }

        .save-password {
            border: none;
            background: #2878bd;
            color: #ffffff;
            border-radius: 11px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
        }

        .password-message {
            margin-top: 13px;
            font-size: 12px;
            display: none;
        }

        /* =========================================
           MOBILE NAV
        ========================================= */

        .mobile-bottom-nav {
            display: none;
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 1000px) {

            .dashboard-sidebar {
                width: 200px;
            }

            .stats-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .achievement-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 700px) {

            .dashboard-header {
                padding: 0 15px;
            }

            .brand-text p {
                display: none;
            }

            .student-mini-name,
            .student-mini-class {
                display: none;
            }

            .dashboard-layout {
                display: block;
            }

            .dashboard-sidebar {
                display: none;
            }

            .dashboard-main {
                padding: 25px 15px 95px;
            }

            .page-heading {
                display: block;
            }

            .page-heading h2 {
                font-size: 24px;
            }

            .date-badge {
                display: inline-block;
                margin-top: 12px;
            }

            .welcome-card {
                padding: 20px;
            }

            font-size: 22px;
margin: 0 0 8px;
}

.welcome-card p {
    margin: 0;
    font-size: 14px;
}

.dashboard-card {
    padding: 20px;
}

.dashboard-card h3 {
    font-size: 18px;
}

.profile-grid {
    grid-template-columns: 1fr;
}

.profile-field {
    padding: 12px;
}

.results-table {
    display: block;
    overflow-x: auto;
}

.results-table table {
    min-width: 600px;
}

.stat-grid {
    grid-template-columns: repeat(2, 1fr);
}

.dashboard-actions {
    grid-template-columns: 1fr;
}

.card-grid {
    grid-template-columns: 1fr;
}

.event-card,
.notice-card,
.achievement-card {
    padding: 18px;
}

.dashboard-footer {
    padding-bottom: 90px;
}

}

/* =========================================
   SMALL MOBILE
========================================= */

@media (max-width: 480px) {

    .dashboard-main {
        padding: 20px 12px 100px;
    }

    .page-heading h2 {
        font-size: 21px;
    }

    .welcome-card {
        padding: 18px;
    }

    .welcome-card h3 {
        font-size: 20px;
    }

    .stat-grid {
        grid-template-columns: 1fr;
    }

    }

/* =========================================
   ACCESSIBILITY
========================================= */

button:focus-visible,
a:focus-visible {
    outline: 3px solid rgba(37, 99, 235, 0.35);
    outline-offset: 3px;
}

   REDUCED MOTION
========================================= */

@media (prefers-reduced-motion: reduce) {

</style>

<!-- =========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
/* =========================================
   STUDENT DASHBOARD - SUPABASE
========================================= */

async function loadStudentDashboard() {

    try {

        /* Check login session */

        const {
            data: {
                session
            },
            error: sessionError
        } = await supabaseClient.auth.getSession();


        if (sessionError) {

            console.error(sessionError);

            window.location.href =
                "student-login.html";

            return;

        }


        /* No logged-in student */

        if (!session) {

            window.location.href =
                "student-login.html";

            return;

        }


        /* Get logged-in student's profile */

        const {
            data: student,
            error
        } = await supabaseClient
            .from("students")
            .select("*")
            .eq("id", session.user.id)
            .single();


        if (error || !student) {

            console.error(
                "Student profile error:",
                error
            );

            alert(
                "Student profile could not be found."
            );

            await supabaseClient.auth.signOut();

            window.location.href =
                "student-login.html";

            return;

        }


        /* =====================================
           DISPLAY STUDENT NAME
        ===================================== */

        const miniName =
            document.querySelector(
                ".student-mini-name"
            );

        if (miniName) {
            miniName.textContent =
                student.full_name;
        }


        /* =====================================
           DISPLAY CLASS
        ===================================== */

        const miniClass =
            document.querySelector(
                ".student-mini-class"
            );

        if (miniClass) {

            miniClass.textContent =
                `${student.class_name || ""} • ${student.section || ""}`;

        }


        /* =====================================
           WELCOME MESSAGE
        ===================================== */

        const welcomeHeading =
            document.querySelector(
                ".welcome-card h3"
            );

        if (welcomeHeading) {

            welcomeHeading.textContent =
                `Welcome, ${student.full_name}! 👋`;

        }


        /* =====================================
           PROFILE DETAILS
        ===================================== */

        const profileFields =
            document.querySelectorAll(
                ".profile-details .profile-field strong"
            );


        if (profileFields.length >= 8) {

            profileFields[0].textContent =
                student.full_name || "—";

            profileFields[1].textContent =
                student.roll_number || "—";

            profileFields[2].textContent =
                student.class_name || "—";

            profileFields[3].textContent =
                student.section || "—";

            profileFields[4].textContent =
                student.date_of_birth
                    ? formatDate(student.date_of_birth)
                    : "—";

            profileFields[5].textContent =
                student.academic_year || "—";

            profileFields[6].textContent =
                student.parent_name || "—";

            profileFields[7].textContent =
                "Active Student";

        }


        /* =====================================
           STUDENT ID IN QUICK INFO
        ===================================== */

        const quickFields =
            document.querySelectorAll(
                ".dashboard-main .profile-field strong"
            );

        if (quickFields.length > 0) {

            quickFields[
                quickFields.length - 2
            ].textContent =
                student.roll_number || "—";

        }


        /* =====================================
           LOAD RESULTS
        ===================================== */

        await loadResults(session.user.id);


        /* =====================================
           LOAD ATTENDANCE
        ===================================== */

        await loadAttendance(session.user.id);


    } catch (error) {

        console.error(
            "Dashboard error:",
            error
        );

        window.location.href =
            "student-login.html";

    }

}


/* =========================================
   RESULTS
========================================= */

async function loadResults(studentId) {

    const {
        data,
        error
    } = await supabaseClient
        .from("results")
        .select("*")
        .eq("student_id", studentId)
        .order("created_at", {
            ascending: false
        });


    if (error) {

        console.error(
            "Results error:",
            error
        );

        return;

    }


    console.log(
        "Student results:",
        data
    );

}


/* =========================================
   ATTENDANCE
========================================= */

async function loadAttendance(studentId) {

    const {
        data,
        error
    } = await supabaseClient
        .from("attendance")
        .select("*")
        .eq("student_id", studentId)
        .order("attendance_date", {
            ascending: false
        });


    if (error) {

        console.error(
            "Attendance error:",
            error
        );

        return;

    }


    console.log(
        "Student attendance:",
        data
    );

}


/* =========================================
   DATE FORMAT
========================================= */

function formatDate(dateString) {

    const date =
        new Date(dateString);


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/* =========================================
   SECTION NAVIGATION
========================================= */

function showSection(sectionName) {

    const sections =
        document.querySelectorAll(
            ".dashboard-section"
        );


    sections.forEach(function (section) {

        section.classList.remove(
            "active"
        );

    });


    const selectedSection =
        document.getElementById(
            sectionName
        );


    if (selectedSection) {

        selectedSection.classList.add(
            "active"
        );

    }


    const sidebarLinks =
        document.querySelectorAll(
            ".sidebar-link[data-section]"
        );


    sidebarLinks.forEach(function (link) {

        link.classList.remove(
            "active"
        );


        if (
            link.dataset.section ===
            sectionName
        ) {

            link.classList.add(
                "active"
            );

        }

    });


    const mobileLinks =
        document.querySelectorAll(
            ".mobile-nav-button[data-section]"
        );


    mobileLinks.forEach(function (link) {

        link.classList.remove(
            "active"
        );


        if (
            link.dataset.section ===
            sectionName
        ) {

            link.classList.add(
                "active"
            );

        }

    });


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================
   LOGOUT
========================================= */

async function logoutStudent() {

    const confirmed =
        confirm(
            "Are you sure you want to logout?"
        );


    if (!confirmed) {
        return;
    }


    const {
        error
    } = await supabaseClient.auth.signOut();


    if (error) {

        console.error(
            "Logout error:",
            error
        );

        alert(
            "Unable to logout. Please try again."
        );

        return;

    }


    window.location.href =
        "student-login.html";

}


/* =========================================
   CURRENT DATE
========================================= */

function updateDate() {

    const dateElement =
        document.getElementById(
            "currentDate"
        );


    if (!dateElement) {
        return;
    }


    const today =
        new Date();


    dateElement.textContent =
        today.toLocaleDateString(
            "en-IN",
            {
                weekday: "short",
                day: "numeric",
                month: "short",
                year: "numeric"
            }
        );

}


updateDate();

loadStudentDashboard();
